name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS ships bash 3.2 as /bin/bash: run everything with it to keep
          # the scripts compatible with what engineers' Macs have.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the matrix bash for every script
        run: |
          mkdir -p "$RUNNER_TEMP/bash-bin"
          ln -sf "$(command -v ${{ matrix.bash }})" "$RUNNER_TEMP/bash-bin/bash"
          echo "$RUNNER_TEMP/bash-bin" >> "$GITHUB_PATH"
      - name: Show versions
        run: bash --version | head -n 1 && git --version
      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Run tests
        env:
          VERBOSE: "1"
          SUITE_TIMEOUT: "300"
        run: bash tests/run-all.sh
