# .feature-coordinator.conf - team stack for feature-coordinator
#
# Commit this file at the root of the anchor repository (the repo that holds
# feature specs and plans). Engineers override keys for their own machine in
# <workspace>/.feature/config, or per shell with FC_* environment variables.
# Format: key = value. Lines starting with # are comments.
# Never put secrets here: name the environment variable that holds them.

# --- Work tracking -------------------------------------------------------
# azure-boards | jira | github-issues | linear | gitlab-issues | none
tracker = azure-boards
tracker.url = https://dev.azure.com/contoso
tracker.project = Payments

# --- Code host -----------------------------------------------------------
# auto (detect per repo from origin) | github | azure-repos | gitlab | bitbucket
code_host = auto

# --- Team chat (only used when your human partner asks) -------------------
# teams | slack | discord | none
chat = teams
chat.channel = Payments Eng
# Each engineer exports this variable with the channel's webhook URL.
chat.webhook_env = FC_TEAMS_WEBHOOK

# --- Conventions ---------------------------------------------------------
branch_prefix = feature/
docs_dir = docs/features

# Gate commands run by the Stop hook in each worker's worktree.
# (A repo can also set "gate = ..." in its own .feature-coordinator.conf.)
gate.billing-service = make test lint
gate.web-app = npm test -- --watch=false && npm run lint

# Paths where any edit needs your human partner's explicit OK (Tier 3).
protected_paths = **/auth/**, **/billing/**, .github/workflows/*, azure-pipelines.yml, package.json, go.mod

# --- Sessions --------------------------------------------------------------
# claude | copilot | codex
default_cli = claude
# Claude Code models per role (other CLIs use their own model settings).
coordinator_model = opus
worker_model = sonnet
model.billing-service = opus
effort = high
